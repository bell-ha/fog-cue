<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect width="1920" height="1080" fill="#ffffff"/><text x="131" y="190" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="58">과업분석</tspan></text><rect x="131" y="231" width="105" height="8" fill="#00A651"/><text x="131" y="340" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="36">보행동결이 오면 박자 소리로 걸음을 돕고, 넘어지면 보호자에게 알리는 서비스</tspan></text><text x="131" y="440" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="600" fill="#555555" text-anchor="start"><tspan fill="#555555" font-weight="600" font-size="28">김영수 · 혼자서 화장실 다녀오기</tspan></text><rect x="131" y="475" width="280" height="96" rx="10" fill="#f4f4f4"/><text x="271.0" y="535" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="700" font-size="30">일어서기</tspan></text><path d="M 421 523 L 463 523" stroke="#9e9e9e" stroke-width="3"/><path d="M 463 515 L 477 523 L 463 531 Z" fill="#9e9e9e"/><rect x="475" y="475" width="280" height="96" rx="10" fill="#00A651"/><text x="615.0" y="535" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan fill="#ffffff" font-weight="700" font-size="30">첫발 떼기</tspan></text><text x="615.0" y="625" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="500" fill="#00A651" text-anchor="middle"><tspan fill="#00A651" font-weight="500" font-size="28">떨면서 못 떼면</tspan></text><text x="615.0" y="665" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#00A651" text-anchor="middle"><tspan fill="#00A651" font-weight="700" font-size="28">박자 소리가 나옴</tspan></text><path d="M 765 523 L 807 523" stroke="#9e9e9e" stroke-width="3"/><path d="M 807 515 L 821 523 L 807 531 Z" fill="#9e9e9e"/><rect x="819" y="475" width="280" height="96" rx="10" fill="#f4f4f4"/><text x="959.0" y="535" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="700" font-size="30">거실 걷기</tspan></text><path d="M 1109 523 L 1151 523" stroke="#9e9e9e" stroke-width="3"/><path d="M 1151 515 L 1165 523 L 1151 531 Z" fill="#9e9e9e"/><rect x="1163" y="475" width="280" height="96" rx="10" fill="#00A651"/><text x="1303.0" y="535" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan fill="#ffffff" font-weight="700" font-size="30">화장실 문 지나기</tspan></text><text x="1303.0" y="625" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="500" fill="#00A651" text-anchor="middle"><tspan fill="#00A651" font-weight="500" font-size="28">굳으면</tspan></text><text x="1303.0" y="665" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#00A651" text-anchor="middle"><tspan fill="#00A651" font-weight="700" font-size="28">박자 소리가 나옴</tspan></text><path d="M 1453 523 L 1495 523" stroke="#9e9e9e" stroke-width="3"/><path d="M 1495 515 L 1509 523 L 1495 531 Z" fill="#9e9e9e"/><rect x="1507" y="475" width="280" height="96" rx="10" fill="#f4f4f4"/><text x="1647.0" y="535" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="700" font-size="30">앉기</tspan></text><line x1="131" y1="740" x2="1787" y2="740" stroke="#dddddd" stroke-width="2"/><text x="131" y="815" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="30">김영수</tspan><tspan fill="#555555" font-weight="400" font-size="24">  넘어졌을 때</tspan></text><text x="131" y="870" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="28">진동과 소리로 알림</tspan></text><text x="131" y="916" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="28">보호자에게도 바로 알림</tspan></text><text x="691" y="815" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="30">김수진</tspan><tspan fill="#555555" font-weight="400" font-size="24">  보호자</tspan></text><text x="691" y="870" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="28">앱에서 상태 확인 후 전화</tspan></text><text x="691" y="916" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="28">저녁에 하루 기록 확인</tspan></text><text x="1251" y="815" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="30">이지은</tspan><tspan fill="#555555" font-weight="400" font-size="24">  방문간호사</tspan></text><text x="1251" y="870" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="28">방문 때 기록 확인</tspan></text><text x="1251" y="916" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="28">자주 굳는 시간대 파악</tspan></text><text x="1787" y="1040" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="400" fill="#bbbbbb" text-anchor="end"><tspan fill="#bbbbbb" font-weight="400" font-size="19">6</tspan></text></svg>