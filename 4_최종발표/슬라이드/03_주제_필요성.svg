<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect width="1920" height="1080" fill="#ffffff"/><text x="131" y="190" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="58">주제 필요성</tspan></text><rect x="131" y="231" width="105" height="8" fill="#00A651"/><text x="131" y="340" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="40" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="40">걷다가 갑자기 발이 바닥에 붙은 듯 멈추는 증상</tspan></text><circle cx="146" cy="430.1" r="6" fill="#00A651"/><text x="168" y="440.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="30">몇 초에서 수십 초 동안 발이 안 떨어짐</tspan></text><circle cx="146" cy="481.1" r="6" fill="#00A651"/><text x="168" y="491.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="30">좁은 문 앞, 돌아설 때, 약효가 떨어질 때 자주 생김</tspan></text><circle cx="146" cy="532.1" r="6" fill="#00A651"/><text x="168" y="542.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="30">넘어지는 주된 원인</tspan></text><text x="131" y="700" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="30">국내 파킨슨병 환자 수   </tspan><tspan fill="#1a1a1a" font-weight="500" font-size="30">4년 동안 </tspan><tspan fill="#00A651" font-weight="800" font-size="30">13.9%</tspan><tspan fill="#1a1a1a" font-weight="500" font-size="30"> 증가</tspan></text><rect x="160" y="798" width="150" height="132" fill="#bdbdbd"/><text x="235" y="784.3148472194142" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="700" font-size="28">12.6만 명</tspan></text><text x="235" y="966" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#555555" text-anchor="middle"><tspan fill="#555555" font-weight="400" font-size="28">2020</tspan></text><rect x="420" y="780" width="150" height="150" fill="#00A651"/><text x="495" y="766.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="700" font-size="28">14.3만 명</tspan></text><text x="495" y="966" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#555555" text-anchor="middle"><tspan fill="#555555" font-weight="400" font-size="28">2024</tspan></text><line x1="140" y1="930" x2="690" y2="930" stroke="#1a1a1a" stroke-width="2"/><circle cx="1480" cy="560" r="180" fill="none" stroke="#e8e8e8" stroke-width="60"/><path d="M 1480 380 A 180 180 0 0 1 1513.7 736.8" fill="none" stroke="#00A651" stroke-width="60"/><text x="1480" y="584" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="72" font-weight="800" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="800" font-size="72">47%</tspan></text><text x="1480" y="830" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="600" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="600" font-size="28">보행동결을 자주 겪는다고 답한 환자</tspan></text><text x="1480" y="872" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="400" fill="#555555" text-anchor="middle"><tspan fill="#555555" font-weight="400" font-size="26">파킨슨병 환자 6,620명 설문</tspan></text>