<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect width="1920" height="1080" fill="#ffffff"/><text x="131" y="190" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="58">성찰</tspan></text><rect x="131" y="231" width="105" height="8" fill="#00A651"/><text x="131" y="330" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#555555" text-anchor="start"><tspan fill="#555555" font-weight="700" font-size="30">아쉬운 점</tspan></text><circle cx="146" cy="399.44" r="6" fill="#00A651"/><text x="168" y="410.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="32">허리에 차도록 설계했지만 시연은 손에 들고 함</tspan></text><circle cx="146" cy="489.44" r="6" fill="#00A651"/><text x="168" y="500.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="32">몇 초 동안의 움직임을 모아 판단해서 반응이 늦음</tspan></text><text x="178" y="560.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#444444" text-anchor="start"><tspan fill="#444444" font-weight="400" font-size="28">– 동결 후 약 3초 지나야 박자 소리가 나옴</tspan></text><text x="178" y="604.8" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#444444" text-anchor="start"><tspan fill="#444444" font-weight="400" font-size="28">– 박자는 5초 전 케이던스라 지금 걸음과 다를 수 있음</tspan></text><circle cx="146" cy="679.44" r="6" fill="#00A651"/><text x="168" y="690.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="32">털썩 앉은 것과 넘어진 것을 구별하지 못함</tspan></text><text x="178" y="750.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#444444" text-anchor="start"><tspan fill="#444444" font-weight="400" font-size="28">– 개선 방법: 넘어질 땐 충격 직전에 몸이 잠깐 붕 뜸(0 g 근처)</tspan></text><text x="178" y="794.8" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="400" fill="#444444" text-anchor="start"><tspan fill="#444444" font-weight="400" font-size="28">   이 순간을 같이 보면 구별할 수 있음</tspan></text><text x="1150" y="330" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#00A651" text-anchor="start"><tspan fill="#00A651" font-weight="700" font-size="30">향후 과제</tspan></text><text x="1150" y="410" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="800" fill="#00A651" text-anchor="start"><tspan fill="#00A651" font-weight="800" font-size="30">1</tspan></text><text x="1195" y="410" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="30">환자 데이터로 기준 다시 맞추기</tspan></text><text x="1150" y="500" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="800" fill="#00A651" text-anchor="start"><tspan fill="#00A651" font-weight="800" font-size="30">2</tspan></text><text x="1195" y="500" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="30">벨트 형태로 완성하기</tspan></text><text x="1150" y="590" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="800" fill="#00A651" text-anchor="start"><tspan fill="#00A651" font-weight="800" font-size="30">3</tspan></text><text x="1195" y="590" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="30">털썩 앉기와 넘어짐 구별하기</tspan></text><text x="1150" y="680" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="800" fill="#00A651" text-anchor="start"><tspan fill="#00A651" font-weight="800" font-size="30">4</tspan></text><text x="1195" y="680" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="30">실제 휴대폰으로 알림 보내기</tspan></text><text x="1787" y="1040" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="400" fill="#bbbbbb" text-anchor="end"><tspan fill="#bbbbbb" font-weight="400" font-size="19">17</tspan></text></svg>