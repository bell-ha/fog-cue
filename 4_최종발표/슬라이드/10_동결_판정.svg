ight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="28">움직이고 있을 때</tspan></text><text x="1000" y="840" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="34">걸음 규칙성 &lt; 0.41  또는  동결 지수 ≥ 1.5</tspan></text><text x="1000" y="890" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="28">이 상태가 1초 간격으로 두 번 나오면 동결로 판정</tspan></text><text x="1787" y="1040" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="400" fill="#bbbbbb" text-anchor="end"><tspan fill="#bbbbbb" font-weight="400" font-size="19">10</tspan></text></svg>