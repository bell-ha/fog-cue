<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect width="1920" height="1080" fill="#ffffff"/><text x="131" y="190" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="58">리듬 청각 자극</tspan></text><rect x="131" y="231" width="105" height="8" fill="#00A651"/><circle cx="146" cy="330.1" r="6" fill="#00A651"/><text x="168" y="340.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="30">케이던스(분당 걸음 수) = 최근 네 걸음 간격의 중간값으로 계산</tspan></text><circle cx="146" cy="387.1" r="6" fill="#00A651"/><text x="168" y="397.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="30">동결 중에는 떨림까지 걸음으로 잡혀서 케이던스가 높게 나옴</tspan></text><circle cx="146" cy="444.1" r="6" fill="#00A651"/><text x="168" y="454.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="400" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="400" font-size="30">그래서 </tspan><tspan fill="#00A651" font-weight="700" font-size="30">동결 5초 전 케이던스</tspan><tspan fill="#1a1a1a" font-weight="400" font-size="30">로 박자를 냄</tspan></text><text x="131" y="610" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="700" font-size="30">자극이 나오는 순서</tspan></text><circle cx="145" cy="680" r="11" fill="#00A651"/><line x1="145" y1="694" x2="145" y2="742" stroke="#bdbdbd" stroke-width="3"/><text x="180" y="690" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="30">진동 0.5초 먼저</tspan></text><circle cx="145" cy="755" r="11" fill="#00A651"/><line x1="145" y1="769" x2="145" y2="817" stroke="#bdbdbd" stroke-width="3"/><text x="180" y="765" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="30">소리는 작게 시작</tspan></text><circle cx="145" cy="830" r="11" fill="#9e9e9e"/><text x="180" y="840" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#1a1a1a" text-anchor="start"><tspan fill="#1a1a1a" font-weight="500" font-size="30">30초 후 자동 정지</tspan></text><line x1="1000" y1="800" x2="1787" y2="800" stroke="#1a1a1a" stroke-width="2"/><line x1="1000" y1="330" x2="1000" y2="800" stroke="#1a1a1a" stroke-width="2"/><polyline points="1000,654 1112,659 1225,649 1337,654 1394,654 1438,643" fill="none" stroke="#00A651" stroke-width="5"/><polyline points="1438,643 1478,528 1517,602 1562,445 1607,497 1646,398 1675,455" fill="none" stroke="#9e9e9e" stroke-width="5"/><line x1="1675" y1="330" x2="1675" y2="800" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1674.5714285714284" y="314" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan fill="#1a1a1a" font-weight="700" font-size="26">동결 판정</tspan></text><circle cx="1394" cy="654" r="12" fill="#00A651"/><text x="1393.5" y="709.7777777777778" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#00A651" text-anchor="middle"><tspan fill="#00A651" font-weight="700" font-size="26">5초 전 · 분당 88걸음</tspan></text><text x="1550.9" y="378.22222222222223" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="500" fill="#555555" text-anchor="middle"><tspan fill="#555555" font-weight="500" font-size="26">떨림이 섞임</tspan></text><text x="1787" y="844" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="400" fill="#555555" text-anchor="end"><tspan fill="#555555" font-weight="400" font-size="26">시간 →</tspan></text><text x="1012" y="314" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="400" fill="#555555" text-anchor="start"><tspan fill="#555555" font-weight="400" font-size="26">분당 걸음 수 (예시)</tspan></text><text x="1787" y="1040" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="400" fill="#bbbbbb" text-anchor="end"><tspan fill="#bbbbbb" font-weight="400" font-size="19">11</tspan></text></svg>