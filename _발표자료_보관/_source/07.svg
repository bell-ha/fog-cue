<!-- 07 떨림 주파수로 동결을 감지한다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <text x="110" y="104" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">개발 세부 ① 검출 알고리즘</text>
  <text x="110" y="168" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#111111">떨림 주파수로 보행 동결(FoG)을 검출한다</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>
  <circle cx="120" cy="293" r="4" fill="#00A651"/>
  <text x="142" y="300" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" fill="#111111">허리 가속도를 주파수로 분해한다</text>
  <text x="142" y="325" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" fill="#666666">어느 빠르기의 움직임에 힘이 실렸는지 드러난다</text>
  <circle cx="120" cy="371" r="4" fill="#00A651"/>
  <text x="142" y="378" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" fill="#111111">정상 보행은 0.5~3 Hz, 얼어붙을 때는 3~8 Hz로 갈린다</text>
  <text x="142" y="403" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" fill="#666666">1초에 0.5~3번 흔들리던 것이, 3~8번으로 빨라진다</text>
  <circle cx="120" cy="449" r="4" fill="#00A651"/>
  <text x="142" y="456" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" fill="#111111">크기 자체가 아니라 두 구간(대역)의 비율로 본다</text>
  <text x="142" y="481" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" fill="#666666">떨림 크기는 사람마다 다르지만, 비율로 보면 그 차이가 상쇄된다</text>
  <circle cx="120" cy="527" r="4" fill="#00A651"/>
  <text x="142" y="534" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" fill="#111111">임계값을 넘은 상태가 이어질 때만 판정한다</text>
  <text x="142" y="559" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" fill="#666666">계단이나 방향 전환에서 순간 튀는 값을 걸러낸다</text>
  <!-- 핵심 정의 블록 -->
  <rect x="110" y="600" width="4" height="120" fill="#00A651"/>
  <text x="134" y="626" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#00A651">Freeze Index</text>
  <text x="134" y="666" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="25" font-weight="700" fill="#111111">3~8 Hz 대역의 세기 ÷ 0.5~3 Hz 대역의 세기</text>
  <text x="134" y="700" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" fill="#444444">예측이 아니라 검출 지표다 — 동결이 시작된 직후에 개입한다.</text>
  <text x="840" y="288" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#111111">가속도 주파수 스펙트럼 — 정상 보행 vs 동결</text>
  <text x="840" y="336" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#111111">정상 보행 — Freeze Index 낮음</text>
