<!-- 04 박자를 들려주면 굳은 다리가 풀린다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  
  
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>

  <!-- ══ 좌 : 불릿 ══ -->
  <g fill="#00A651">
    <circle cx="120" cy="252" r="4"/>
    <circle cx="120" cy="330" r="4"/>
    <circle cx="120" cy="408" r="4"/>
    <circle cx="120" cy="486" r="4"/>
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#444444">
    
    
    
    
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#666666">
    
    
    
    
  </g>

  <!-- 문제 정의 — 한 장에 하나만 -->
  <line x1="110" y1="586" x2="110" y2="744" stroke="#00A651" stroke-width="4"/>
  
  
  
  

  <!-- ══ 우 : RAS 효과크기 ══ -->
  

  <!-- 눈금선 (1 SD = 400px, 기준선 y=620) -->
  <g stroke="#E0E0E0" stroke-width="1">
    <line x1="930" y1="520" x2="1470" y2="520"/>
    <line x1="930" y1="420" x2="1470" y2="420"/>
  </g>
  <g font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666" text-anchor="end">
    
    
    
  </g>

  <rect x="975" y="408" width="110" height="212" fill="#00A651"/>
  <rect x="1145" y="416" width="110" height="204" fill="#00A651"/>
  <!-- 케이던스 : 유의한 효과가 없으므로 막대를 그리지 않는다.
       WMD 1.57은 SD가 아니라 분당 걸음 수라 같은 축에 올릴 수 없다 -->
  
  

  <line x1="930" y1="620" x2="1470" y2="620" stroke="#111111" stroke-width="2"/>
  <circle cx="1370" cy="620" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="2"/>

  <g font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="24" fill="#111111" text-anchor="middle">
    
    
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#666666" text-anchor="middle">
    
    
    
  </g>
  
  
  

  <line x1="110" y1="772" x2="1490" y2="772" stroke="#E0E0E0" stroke-width="1"/>
  
  

  

</svg>
