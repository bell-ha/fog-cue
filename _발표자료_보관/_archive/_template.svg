<!-- 템플릿 — 밝은 장 기준. 복사해서 쓰고 이 주석은 지울 것 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <!-- 배경 (어두운 장이면 #0E1216) -->
  <rect x="0" y="0" width="1600" height="900" fill="#F4F2ED"/>

  <!-- 슬라이드 번호 -->
  <text x="110" y="104" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="20" fill="#8A9098">01</text>

  <!-- 요건 라벨 (없는 장은 통째로 삭제) -->
  <rect x="1330" y="80" width="160" height="34" rx="3" fill="none" stroke="#DCD8D0"/>
  <text x="1410" y="103" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" letter-spacing="0.08em" fill="#8A9098">주제</text>

  <!-- 제목 -->
  <text x="110" y="232" font-family="Hahmlet,'Nanum Myeongjo','Apple SD Gothic Neo',serif" font-weight="600" font-size="54" fill="#14181C">슬라이드 제목</text>
  <line x1="110" y1="272" x2="1490" y2="272" stroke="#DCD8D0" stroke-width="1"/>

  <!-- 본문 시작 y=346 -->
  <text x="110" y="346" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" fill="#5A636B">본문 첫 줄<tspan x="110" dy="42">둘째 줄은 tspan dy=42</tspan></text>

  <!-- ─── 하단 진행 틱 (전 장 필수) ─── -->
  <!-- 비활성 11개 + 활성 1개. 활성 인덱스 = 슬라이드번호-1 -->
  <g stroke="#DCD8D0" stroke-width="2">
    <line x1="128" y1="828" x2="128" y2="838"/>
    <line x1="146" y1="828" x2="146" y2="838"/>
    <line x1="164" y1="828" x2="164" y2="838"/>
    <line x1="182" y1="828" x2="182" y2="838"/>
    <line x1="200" y1="828" x2="200" y2="838"/>
    <line x1="218" y1="828" x2="218" y2="838"/>
    <line x1="236" y1="828" x2="236" y2="838"/>
    <line x1="254" y1="828" x2="254" y2="838"/>
    <line x1="272" y1="828" x2="272" y2="838"/>
    <line x1="290" y1="828" x2="290" y2="838"/>
    <line x1="308" y1="828" x2="308" y2="838"/>
  </g>
  <!-- 활성 틱 : i=0 → x=110 -->
  <line x1="110" y1="812" x2="110" y2="838" stroke="#A87218" stroke-width="3"/>

  <!-- 러닝 캡션 -->
  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="16" letter-spacing="0.08em" fill="#8A9098">아타카 ATTACCA</text>

</svg>
