<!-- 09 구현 계획 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <text x="110" y="104" font-size="22" font-weight="700" fill="#00A651">구현 계획</text>
  <text x="110" y="168" font-size="54" font-weight="700" fill="#111111">4단계로 나누어 만든다</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>
  <text x="110" y="246" font-size="22" fill="#444444">동결 검출부터 시작하면 몇 주를 허비한다. 걸음 검출부터 하나씩 쌓아 올린다.</text>

  <!-- 주차 격자 : 0주 x=140, 14주 x=1460 → 1주 = 94.3px -->
  <g stroke="#E0E0E0" stroke-width="1">
    <line x1="423" y1="300" x2="423" y2="690"/><line x1="706" y1="300" x2="706" y2="690"/>
    <line x1="1083" y1="300" x2="1083" y2="690"/>
  </g>
  <line x1="140" y1="690" x2="1460" y2="690" stroke="#111111" stroke-width="2"/>
  <g font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="16" fill="#666666">
    <text x="140" y="718">0</text><text x="423" y="718" text-anchor="middle">3</text>
    <text x="706" y="718" text-anchor="middle">6</text><text x="1083" y="718" text-anchor="middle">10</text>
    <text x="1460" y="718" text-anchor="end">14주</text>
  </g>

  <!-- 최소 목표 경계 -->
  <line x1="706" y1="290" x2="706" y2="742" stroke="#00A651" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="692" y="748" text-anchor="end" font-size="18" font-weight="700" fill="#00A651">여기까지가 최소 목표</text>
  <text x="720" y="748" font-size="18" fill="#666666">도전 목표</text>

  <!-- 1단계 -->
  <rect x="140" y="314" width="283" height="48" rx="4" fill="#00A651"/>
  <text x="158" y="345" font-size="20" font-weight="700" fill="#FFFFFF">1 · 걸음을 검출한다</text>
  <text x="140" y="398" font-size="18" fill="#444444">3축 가속도에서<tspan x="140" dy="26">봉우리를 찾아</tspan><tspan x="140" dy="26">걸음으로 센다.</tspan></text>
  <text x="140" y="506" font-size="15" fill="#00A651">확인</text>
  <text x="140" y="532" font-size="17" font-weight="600" fill="#111111">100걸음에<tspan x="140" dy="24">100을 센다</tspan></text>

  <!-- 2단계 -->
  <rect x="423" y="314" width="283" height="48" rx="4" fill="#00A651"/>
  <text x="441" y="345" font-size="20" font-weight="700" fill="#FFFFFF">2 · 멈추면 울린다</text>
  <text x="423" y="398" font-size="18" fill="#444444">걸음이 끊기면<tspan x="423" dy="26">직전 간격에 맞춰</tspan><tspan x="423" dy="26">부저를 울린다.</tspan></text>
  <text x="423" y="506" font-size="15" fill="#00A651">확인</text>
  <text x="423" y="532" font-size="17" font-weight="600" fill="#111111">멈추면 울리고<tspan x="423" dy="24">걸으면 멎는다</tspan></text>

  <!-- 3단계 -->
  <rect x="706" y="314" width="377" height="48" rx="4" fill="#7CCFA4"/>
  <text x="724" y="345" font-size="20" font-weight="700" fill="#FFFFFF">3 · 동결을 검출한다</text>
  <text x="706" y="398" font-size="18" fill="#444444">Freeze Index를 PC에서 먼저<tspan x="706" dy="26">구현하고, DAPHNet으로 임계값을</tspan><tspan x="706" dy="26">맞춘 뒤 ESP32로 옮긴다.</tspan></text>
  <text x="706" y="506" font-size="15" fill="#00A651">확인</text>
  <text x="706" y="532" font-size="17" font-weight="600" fill="#111111">민감도 · 특이도 · 검출 지연을<tspan x="706" dy="24">피험자별 교차검증으로 낸다</tspan></text>

  <!-- 4단계 -->
  <rect x="1083" y="314" width="377" height="48" rx="4" fill="#C2E6D2"/>
  <text x="1101" y="345" font-size="20" font-weight="700" fill="#0B7A3D">4 · 부가 기능을 붙인다</text>
  <text x="1083" y="398" font-size="18" fill="#444444">OLED 기록 화면, 택트스위치<tspan x="1083" dy="26">수동 요청, WiFi 전송.</tspan><tspan x="1083" dy="26">케이스와 배터리는 마지막이다.</tspan></text>

  <line x1="110" y1="772" x2="1490" y2="772" stroke="#E0E0E0" stroke-width="1"/>
  <text x="110" y="800" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666">막대 길이는 예상 소요 주차 · 프로토타입은 USB 보조배터리로 전원을 공급한다</text>
  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" fill="#BBBBBB">9 / 11</text>
</g>
</svg>
