<!-- 04 박자를 들려주면 굳은 다리가 풀린다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="110" y="104" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="22" fill="#00A651">주제 선정 이유</text>
  <text x="110" y="168" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="54" fill="#111111">박자를 들려주면 굳은 다리가 풀린다</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>

  <!-- ══ 좌 : 불릿 ══ -->
  <g fill="#00A651">
    <circle cx="120" cy="252" r="4"/>
    <circle cx="120" cy="330" r="4"/>
    <circle cx="120" cy="408" r="4"/>
    <circle cx="120" cy="486" r="4"/>
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#444444">
    <text x="142" y="260">규칙적인 박자를 들려주면 얼어붙은 다리가 풀린다</text>
    <text x="142" y="338">박자에 발을 맞추면 막힌 보행 명령이 다른 경로로 나간다</text>
    <text x="142" y="416">메트로놈 소리, 박자가 뚜렷한 음악, 구령을 자극으로 쓴다</text>
    <text x="142" y="494">보행 속도와 보폭은 개선되지만 케이던스(걸음 빠르기)는 올라가지 않는다</text>
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#666666">
    <text x="142" y="292">리듬 청각 자극(RAS)이라 하며, 신경학적 음악치료의 정식 기법이다</text>
    <text x="142" y="370">기저핵을 거치지 않는 경로로 나가는 것으로 설명된다</text>
    <text x="142" y="448">민간요법이 아니라 병원 재활 치료 현장에서 실제로 쓰인다</text>
    <text x="142" y="526">케이던스는 WMD 1.57, P=0.635로 유의하지 않았다 [6]</text>
  </g>

  <!-- 문제 정의 — 한 장에 하나만 -->
  <line x1="110" y1="586" x2="110" y2="744" stroke="#00A651" stroke-width="4"/>
  <text x="136" y="612" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="20" fill="#00A651">왜 이 주제인가</text>
  <text x="136" y="656" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="26" fill="#111111">효과는 입증됐지만 계속 켜두는 방식이라 오래 쓰기 어렵다.</text>
  <text x="136" y="694" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="26" fill="#111111">치료법이 아니라 언제 켜느냐의 문제다.</text>
  <text x="136" y="734" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#666666">앞 장 페르소나의 &#8220;시끄러워서 안 써요&#8221;는 이 문제를 사람의 말로 옮긴 것이다</text>

  <!-- ══ 우 : RAS 효과크기 ══ -->
  <text x="840" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="20" fill="#111111">RAS 효과크기 — 대조군 대비, 메타분석 5편 · 209명 [2]</text>

  <!-- 눈금선 (1 SD = 400px, 기준선 y=620) -->
  <g stroke="#E0E0E0" stroke-width="1">
    <line x1="930" y1="520" x2="1470" y2="520"/>
    <line x1="930" y1="420" x2="1470" y2="420"/>
  </g>
  <g font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666" text-anchor="end">
    <text x="920" y="625">0</text>
    <text x="920" y="525">0.25</text>
    <text x="920" y="425">0.50</text>
  </g>

  <rect x="975" y="408" width="110" height="212" fill="#00A651"/>
  <rect x="1145" y="416" width="110" height="204" fill="#00A651"/>
  <!-- 케이던스 : 유의한 효과가 없으므로 막대를 그리지 않는다.
       WMD 1.57은 SD가 아니라 분당 걸음 수라 같은 축에 올릴 수 없다 -->
  <text x="1370" y="596" text-anchor="middle" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" fill="#666666">유의하지 않음</text>
  <text x="1370" y="572" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666">P=0.635</text>

  <line x1="930" y1="620" x2="1470" y2="620" stroke="#111111" stroke-width="2"/>
  <circle cx="1370" cy="620" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="2"/>

  <g font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="24" fill="#111111" text-anchor="middle">
    <text x="1030" y="392">0.53</text>
    <text x="1200" y="400">0.51</text>
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#666666" text-anchor="middle">
    <text x="1030" y="648">보행 속도</text>
    <text x="1200" y="648">보폭</text>
    <text x="1370" y="648">케이던스</text>
  </g>
  <text x="840" y="678" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#666666">단위는 표준편차(SD) · 근거 수준은 낮음(low)으로 보고됐다 [2]</text>
  <text x="840" y="700" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#666666">케이던스는 단위가 달라 같은 축에 올리지 않았다</text>
  <text x="840" y="742" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="22" fill="#00A651">그래서 케이던스를 올리지 않고, 측정해서 템포를 맞춘다</text>

  <line x1="110" y1="772" x2="1490" y2="772" stroke="#E0E0E0" stroke-width="1"/>
  <text x="110" y="804" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666">[2] Arch Phys Med Rehabil, 2021 (메타분석 5편 · 209명, 근거 수준 낮음)</text>
  <text x="110" y="826" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666">[6] Frontiers in Neurology, 2022 (케이던스 WMD 1.57, P=0.635)</text>

  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" fill="#BBBBBB">4 / 11</text>

</svg>
