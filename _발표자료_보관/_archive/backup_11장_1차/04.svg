<!-- 04 계속 울리면 익숙해져서 안 듣게 된다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <text x="110" y="104" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">기존 방식의 한계</text>
  <text x="110" y="168" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#111111">계속 울리면 익숙해져서 안 듣게 된다</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>
  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" fill="#BBBBBB">4 / 11</text>

  <circle cx="116" cy="260" r="4.5" fill="#00A651"/>
  <text x="138" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">상시 큐잉은 습관화를 일으킨다</text>
  <text x="138" y="298" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">오래 쓸수록 같은 소리에 반응이 줄어든다 [3]</text>
  <circle cx="116" cy="338" r="4.5" fill="#00A651"/>
  <text x="138" y="346" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">인지 부하도 함께 늘어난다</text>
  <text x="138" y="376" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">박자에 계속 맞추느라 주의력을 더 쓴다 [3]</text>
  <circle cx="116" cy="416" r="4.5" fill="#00A651"/>
  <text x="138" y="424" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">상용 제품은 동결을 검출하지 않는다</text>
  <text x="138" y="454" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">Path Finder는 걸음마다 자동 발화, 메트로놈 앱은 상시 재생</text>
  <circle cx="116" cy="494" r="4.5" fill="#00A651"/>
  <text x="138" y="502" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">동결을 검출해 개입하는 건 연구 단계다</text>
  <text x="138" y="532" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">ParCuR — 자동 검출 후 햅틱 큐, 민감도 94.9% [5]</text>

  <rect x="110" y="600" width="4" height="106" fill="#00A651"/>
  <text x="136" y="624" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#00A651">문제 정의</text>
  <text x="136" y="662" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" font-weight="700" fill="#111111">메트로놈은 20분 내내 울리고 있다.</text>
  <text x="136" y="694" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" font-weight="700" fill="#111111">익숙해져서 반응이 사라졌을 뿐이다.</text>

  <text x="850" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#111111">20분 보행 세션 — 소리와 반응</text>
  <text x="850" y="298" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#888888">메트로놈 소리</text>
  <text x="1470" y="298" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">20분 내내 켜짐</text>
  <text x="850" y="394" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#888888">환자의 반응</text>
  <text x="1470" y="394" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">%</text>
