<!-- 05 평소엔 울리지 않고, 동결 때만 울린다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <text x="110" y="104" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">제안</text>
  <text x="110" y="168" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#111111">평소엔 울리지 않고, 동결 때만 울린다</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>
  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" fill="#BBBBBB">5 / 11</text>

  <circle cx="116" cy="260" r="4.5" fill="#00A651"/>
  <text x="138" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">동결을 검출한 순간에만 울린다</text>
  <text x="138" y="298" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">빠른 잔떨림이 일정 시간 유지될 때만 동결로 판정한다</text>
  <circle cx="116" cy="338" r="4.5" fill="#00A651"/>
  <text x="138" y="346" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">직전 케이던스에 맞춘 템포로 울린다</text>
  <text x="138" y="376" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">정해진 템포가 아니라 매번 다시 계산된 값이다</text>
  <circle cx="116" cy="416" r="4.5" fill="#00A651"/>
  <text x="138" y="424" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">발이 떨어지면 즉시 멈춘다</text>
  <text x="138" y="454" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">다시 침묵 — 습관화도 인지 부하도 생기지 않는다</text>
  <circle cx="116" cy="494" r="4.5" fill="#00A651"/>
  <text x="138" y="502" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">실제로 소리가 나는 시간은 일부다</text>
  <text x="138" y="532" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#888888">선행 연구의 on-demand 큐 전달 시간은 전체 보행의 21~29% [3]</text>

  <rect x="110" y="600" width="4" height="106" fill="#00A651"/>
  <text x="136" y="624" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#00A651">기여 지점</text>
  <text x="136" y="662" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" font-weight="700" fill="#111111">동결 검출 + 청각 큐 + 직전 케이던스 템포.</text>
  <text x="136" y="694" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" font-weight="700" fill="#111111">세 번째는 선행 연구 어디에도 없다.</text>

  <text x="850" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#111111">같은 20분 — 소리만 달라진다</text>
  <text x="850" y="298" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#888888">메트로놈 소리</text>
  <text x="1470" y="298" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">20분 중 세 번만 켜짐</text>
  <text x="850" y="394" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#888888">환자의 반응</text>
  <text x="1470" y="394" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">%</text>
  <rect x="850" y="308" width="620" height="44" fill="#F5F5F5"/>
  <text x="840" y="409" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#888888">100</text>
  <text x="840" y="459" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#888888">50</text>
  <text x="840" y="509" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#888888">0</text>
  <line x1="850" y1="454" x2="1470" y2="454" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="906.5" y="308" width="59" height="44" fill="#D6F0E0"/>
  <rect x="1067.5" y="308" width="99" height="44" fill="#D6F0E0"/>
  <rect x="1318.5" y="308" width="47" height="44" fill="#D6F0E0"/>
  <g stroke="#00A651" stroke-width="3">
    <line x1="913.5" y1="312" x2="913.5" y2="352"/>
    <line x1="928.5" y1="312" x2="928.5" y2="352"/>
    <line x1="943.5" y1="312" x2="943.5" y2="352"/>
    <line x1="958.5" y1="312" x2="958.5" y2="352"/>
    <line x1="1074.5" y1="312" x2="1074.5" y2="352"/>
    <line x1="1091.5" y1="312" x2="1091.5" y2="352"/>
    <line x1="1108.5" y1="312" x2="1108.5" y2="352"/>
    <line x1="1125.5" y1="312" x2="1125.5" y2="352"/>
    <line x1="1142.5" y1="312" x2="1142.5" y2="352"/>
    <line x1="1159.5" y1="312" x2="1159.5" y2="352"/>
    <line x1="1325.5" y1="312" x2="1325.5" y2="352"/>
    <line x1="1336.5" y1="312" x2="1336.5" y2="352"/>
    <line x1="1347.5" y1="312" x2="1347.5" y2="352"/>
    <line x1="1358.5" y1="312" x2="1358.5" y2="352"/>
  </g>
  <text x="936" y="374" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="15" fill="#00A651">♩=96</text>
  <text x="1117" y="374" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="15" fill="#00A651">♩=88</text>
  <text x="1342" y="374" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="15" fill="#00A651">♩=104</text>

  <path d="M850,414L910,414 Q936,405 962,414L1091,414 Q1117,405 1143,414L1316,414 Q1342,405 1368,414L1470,414 L1470,504 L850,504 Z" fill="#D3EDDE"/>
  <path d="M850,414L910,414 Q936,405 962,414L1091,414 Q1117,405 1143,414L1316,414 Q1342,405 1368,414L1470,414" fill="none" stroke="#0B7A3D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1462" y="492" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#5A7A66">20분 내내 반응 유지</text>
  <line x1="936" y1="352" x2="936" y2="572" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="1117" y1="352" x2="1117" y2="572" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="1342" y1="352" x2="1342" y2="572" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- ══ 04·05 공유 플롯 좌표 — 두 장 완전 동일 ══ -->
  <line x1="850" y1="352" x2="1470" y2="352" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="850" y1="504" x2="1470" y2="504" stroke="#666666" stroke-width="1.5"/>
  <g stroke="#999999" stroke-width="1">
    <line x1="850" y1="504" x2="850" y2="511"/>
    <line x1="1005" y1="504" x2="1005" y2="511"/>
