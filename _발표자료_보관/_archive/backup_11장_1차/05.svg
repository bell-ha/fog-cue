  <text x="1315" y="528" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">15</text>
  <text x="1470" y="528" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">20</text>
  <text x="1160" y="554" text-anchor="middle" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#888888">경과 시간 (분)</text>
  <circle cx="936" cy="584" r="10" fill="none" stroke="#777777" stroke-width="1.5"/>
  <circle cx="1117" cy="584" r="10" fill="none" stroke="#777777" stroke-width="1.5"/>
  <circle cx="1342" cy="584" r="10" fill="none" stroke="#777777" stroke-width="1.5"/>
  <text x="850" y="589" text-anchor="end" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#888888">동결　</text>
  <text x="850" y="640" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#00A651">20분 동안 소리가 난 것은 세 번뿐이다.</text>

  <line x1="110" y1="772" x2="1490" y2="772" stroke="#E0E0E0" stroke-width="1"/>
  <text x="110" y="800" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">[3] Pallavi et al., On-Demand Cueing Sensitive to Step Variability, IEEE J Transl Eng Health Med, 2025</text>
  <text x="110" y="824" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">[4] Slemenšek et al., Wearable Online Freezing of Gait Detection and Cueing System, Bioengineering, 2024 (n=9 예비연구)</text>
  <text x="110" y="848" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">[5] ParCuR — 동결 자동 검출 기반 햅틱 큐잉, Sensors, 2025</text>

</svg>
