<!-- 02 파킨슨 보행 동결 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="110" y="104" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="22" fill="#00A651">주제</text>
  <text x="110" y="168" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="54" fill="#111111">파킨슨 보행 동결</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>

  <!-- ══ 좌 : 불릿 ══ -->
  <g fill="#00A651">
    <circle cx="120" cy="252" r="4"/>
    <circle cx="120" cy="330" r="4"/>
    <circle cx="120" cy="408" r="4"/>
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#444444">
    <text x="142" y="260">걷던 중 보행 명령이 끊겨 발이 바닥에 붙는다</text>
    <text x="142" y="338">발은 멈췄는데 상체만 앞으로 쏠린다</text>
    <text x="142" y="416">문턱 · 좁은 통로 · 방향 전환 · 약효 저하 시간대에 잦다</text>
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#888888">
    <text x="142" y="292">도파민 부족으로 움직임 명령이 끊기는 것 — 보행 동결(Freezing of Gait, FoG)</text>
    <text x="142" y="370">균형을 잡을 수단이 없어 그대로 넘어진다. 파킨슨 낙상의 주요 원인</text>
    <text x="142" y="448">환자 본인이 예측할 수 없고, 스스로 발을 뗄 수단도 없다</text>
  </g>

  <!-- ══ 좌하 : 3컷 실루엣 ══ 지면선 하나가 3컷을 관통. 세로 구분선·박스 금지 ══ -->
  <text x="110" y="506" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="20" fill="#111111">FoG 진행 3단계</text>
  <line x1="110" y1="522" x2="760" y2="522" stroke="#E0E0E0" stroke-width="1"/>

  <line x1="130" y1="650" x2="750" y2="650" stroke="#111111" stroke-width="2"/>
  <g fill="#888888">
    <ellipse cx="140" cy="659" rx="8" ry="3"/>
    <ellipse cx="174" cy="659" rx="8" ry="3"/>
    <ellipse cx="208" cy="659" rx="8" ry="3"/>
    <ellipse cx="242" cy="659" rx="8" ry="3"/>
    <ellipse cx="276" cy="659" rx="8" ry="3"/>
    <ellipse cx="310" cy="659" rx="8" ry="3"/>
    <ellipse cx="344" cy="659" rx="8" ry="3"/>
    <ellipse cx="378" cy="659" rx="8" ry="3"/>
    <!-- 2컷 : 두 발이 나란히 멈춘다 -->
    <ellipse cx="411" cy="659" rx="8" ry="3"/>
    <ellipse cx="429" cy="659" rx="8" ry="3"/>
  </g>
  <!-- 3컷 뒤로는 발자국이 없다. 이 빈 지면이 낙상을 설명한다 -->

  <g transform="translate(230,340) scale(0.5)">
    <g stroke="#111111" stroke-width="13" stroke-linecap="round">
      <line x1="0" y1="524" x2="30" y2="608"/>
      <line x1="0" y1="524" x2="-32" y2="606"/>
    </g>
    <rect x="22" y="609" width="32" height="8" rx="4" fill="#111111"/>
    <rect x="-46" y="600" width="30" height="8" rx="4" fill="#111111" transform="rotate(-16,-31,604)"/>
    <g transform="rotate(7,0,524)">
      <path d="M -12 524 L 12 524 L 15 468 L -15 468 Z" fill="#111111"/>
      <line x1="0" y1="470" x2="0" y2="456" stroke="#111111" stroke-width="9"/>
      <circle cx="0" cy="437" r="18" fill="#111111"/>
      <g stroke="#111111" stroke-width="10" stroke-linecap="round">
        <line x1="10" y1="474" x2="28" y2="514"/>
        <line x1="-10" y1="474" x2="-26" y2="516"/>
      </g>
    </g>
  </g>

  <g transform="translate(420,340) scale(0.5)">
    <!-- [하체] 아래 4줄은 3컷과 완전히 동일한 좌표다. 절대 수정 금지 -->
    <g stroke="#111111" stroke-width="13" stroke-linecap="round">
      <line x1="-11" y1="524" x2="-18" y2="610"/>
      <line x1="11" y1="524" x2="18" y2="610"/>
    </g>
    <rect x="-34" y="611" width="30" height="8" rx="4" fill="#111111"/>
    <rect x="2" y="611" width="30" height="8" rx="4" fill="#111111"/>
    <!-- [상체] 직립 -->
    <g transform="rotate(0,0,524)">
      <path d="M -12 524 L 12 524 L 15 468 L -15 468 Z" fill="#111111"/>
      <line x1="0" y1="470" x2="0" y2="456" stroke="#111111" stroke-width="9"/>
      <circle cx="0" cy="437" r="18" fill="#111111"/>
      <g stroke="#111111" stroke-width="10" stroke-linecap="round">
        <line x1="10" y1="474" x2="14" y2="520"/>
        <line x1="-10" y1="474" x2="-14" y2="520"/>
      </g>
    </g>
  </g>

  <!-- 3컷 기울기 호 : 점선.
       ※ 반드시 3컷 실루엣 그룹보다 앞에 둘 것. 뒤로 가면 호가 검은 머리 위에 그려져
          얼굴에 흰 점선이 찍힌다. 호는 몸 뒤로 지나가야 한다 -->
  <path d="M 620 558.5 A 43.5 43.5 0 0 1 637.7 562.3" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="4 5"/>

  <g transform="translate(620,340) scale(0.5)">
    <!-- [하체] 2컷에서 그대로 복제. 좌표 한 자리도 다르지 않다 -->
    <g stroke="#111111" stroke-width="13" stroke-linecap="round">
      <line x1="-11" y1="524" x2="-18" y2="610"/>
      <line x1="11" y1="524" x2="18" y2="610"/>
    </g>
    <rect x="-34" y="611" width="30" height="8" rx="4" fill="#111111"/>
    <rect x="2" y="611" width="30" height="8" rx="4" fill="#111111"/>
    <!-- [상체] 엉덩이(0,524)를 축으로 24도만 회전. 이 한 줄이 2컷과의 유일한 차이다 -->
    <g transform="rotate(24,0,524)">
      <path d="M -12 524 L 12 524 L 15 468 L -15 468 Z" fill="#111111"/>
      <line x1="0" y1="470" x2="0" y2="456" stroke="#111111" stroke-width="9"/>
      <circle cx="0" cy="437" r="18" fill="#111111"/>
      <g stroke="#111111" stroke-width="10" stroke-linecap="round">
        <line x1="10" y1="474" x2="14" y2="520"/>
        <line x1="-10" y1="474" x2="-14" y2="520"/>
      </g>
    </g>
  </g>

  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#888888" text-anchor="middle">
    <text x="230" y="684">정상 보행</text>
    <text x="420" y="684">발이 안 떨어진다</text>
    <text x="620" y="684">상체만 앞으로 → 낙상</text>
  </g>
  <text x="110" y="722" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#888888">2컷과 3컷은 발 위치가 같다. 발은 그대로인데 상체만 넘어가는 것이 FoG 낙상이다</text>

  <!-- ══ 우 : 이환 기간별 FoG 유병률 ══
       ※ 누적 구간이다. >=5년은 >=10년을 포함한다. 배타적 구간처럼 비교하면 오독 -->
  <text x="840" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="20" fill="#111111">이환 기간별 FoG 유병률 — 메타분석 29편 · 5,361명 [1]</text>

  <!-- 눈금선 (1% = 3.0px, 기준선 y=620) -->
  <g stroke="#E0E0E0" stroke-width="1">
    <line x1="930" y1="545" x2="1470" y2="545"/>
    <line x1="930" y1="470" x2="1470" y2="470"/>
    <line x1="930" y1="395" x2="1470" y2="395"/>
  </g>
  <g font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888" text-anchor="end">
    <text x="920" y="625">0</text>
    <text x="920" y="550">25</text>
    <text x="920" y="475">50</text>
    <text x="920" y="400">75</text>
  </g>

  <!-- 전체 유병률 39.9 기준선 — 막대보다 먼저 그려 뒤에 깔리게 한다 -->
  <line x1="930" y1="500" x2="1470" y2="500" stroke="#111111" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="934" y="494" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#111111">전체 39.9</text>

  <!-- 막대 : 같은 양이므로 한 hue의 명도 2단계 + 강조 1 -->
  <rect x="975" y="553" width="110" height="67" fill="#B8E6CC"/>
  <rect x="1145" y="460" width="110" height="160" fill="#5CC98C"/>
  <rect x="1315" y="408" width="110" height="212" fill="#00A651"/>

  <!-- 95% CI 오차막대 : 값 라벨과 겹치지 않도록 막대 중심에서 오른쪽으로 35px 이동 -->
  <g stroke="#111111" stroke-width="1.5">
    <line x1="1065" y1="524" x2="1065" y2="582"/>
    <line x1="1055" y1="524" x2="1075" y2="524"/>
    <line x1="1055" y1="582" x2="1075" y2="582"/>
    <line x1="1235" y1="438" x2="1235" y2="483"/>
    <line x1="1225" y1="438" x2="1245" y2="438"/>
    <line x1="1225" y1="483" x2="1245" y2="483"/>
    <line x1="1405" y1="377" x2="1405" y2="438"/>
    <line x1="1395" y1="377" x2="1415" y2="377"/>
    <line x1="1395" y1="438" x2="1415" y2="438"/>
  </g>

  <line x1="930" y1="620" x2="1470" y2="620" stroke="#111111" stroke-width="2"/>

  <g font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="22" text-anchor="middle">
    <text x="1008" y="585" fill="#111111">22.4</text>
    <text x="1178" y="492" fill="#FFFFFF">53.3</text>
    <text x="1348" y="440" fill="#FFFFFF">70.8</text>
  </g>
  <g font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#888888" text-anchor="middle">
    <text x="1030" y="648">&lt; 5년</text>
    <text x="1200" y="648">&#8805; 5년</text>
    <text x="1370" y="648">&#8805; 10년</text>
  </g>
  <text x="840" y="678" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#888888">단위 % · 오차막대는 95% CI · 누적 구간이므로 &#8805;5년은 &#8805;10년을 포함 · 점선은 전체 39.9%</text>
  <text x="840" y="722" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="22" fill="#00A651">진단 후 시간이 지날수록 대부분의 환자가 겪게 된다</text>

  <line x1="110" y1="772" x2="1490" y2="772" stroke="#E0E0E0" stroke-width="1"/>
  <text x="110" y="800" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">[1] Ge et al., The prevalence of freezing of gait in Parkinson&#8217;s disease and in patients with different disease durations and severities,</text>
  <text x="110" y="822" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">    Chinese Neurosurgical Journal, 2020 (메타분석 29편 · 5,361명)</text>

  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" fill="#BBBBBB">2 / 11</text>

</svg>
