<!-- 11 마무리 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <text x="110" y="104" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">결론</text>
  <text x="110" y="168" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#111111">걷다 멈춘 순간에만 울리는 박자</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>
  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" fill="#BBBBBB">11 / 11</text>

  <text x="110" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" fill="#444444">IMU 기반 보행 동결 검출 및 케이던스 적응형 청각 큐잉 시스템 — <tspan font-weight="700" fill="#111111">FoG-Cue</tspan></text>
  <text x="110" y="308" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#888888">허리에 찬 IMU로 동결을 검출하고, 직전 케이던스에 맞춘 템포로 부저를 울린다. 평소에는 울리지 않는다.</text>

  <rect x="110" y="356" width="440" height="300" rx="8" fill="#F5F5F5"/>
  <text x="142" y="408" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">무엇을 만드는가</text>
  <text x="142" y="452" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">ESP32 + MPU-6050 허리 벨트.</text>
  <text x="142" y="482" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">Freeze Index로 동결을 검출하고</text>
  <text x="142" y="512" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">수동 부저로 박자를 낸다.</text>
  <text x="142" y="542" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">동결이 풀리면 즉시 멈춘다.</text>
  <text x="142" y="628" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#888888">핵심 부품 2 · 보조 2 · 확장 2</text>
  <rect x="580" y="356" width="440" height="300" rx="8" fill="#F5F5F5"/>
  <text x="612" y="408" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">검출 성능 목표</text>
  <text x="612" y="452" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">검출 지연 261 ms</text>
  <text x="612" y="482" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">검출 정확도 95.1%</text>
  <text x="612" y="512" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">선행 연구가 보고한 값을</text>
  <text x="612" y="542" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">목표치로 삼는다.</text>
  <text x="612" y="628" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#888888">진동 큐 기반 n=9 예비연구 [4]</text>
  <rect x="1050" y="356" width="440" height="300" rx="8" fill="#F5F5F5"/>
  <text x="1082" y="408" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">어디까지 할 것인가</text>
  <text x="1082" y="452" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">2단계 — 보행 속도에 템포를</text>
  <text x="1082" y="482" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">맞추는 적응형 자극까지가 최소 목표.</text>
  <text x="1082" y="512" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">3단계 — 동결 검출은 도전 목표.</text>
  <text x="1082" y="542" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" fill="#444444">공개 데이터셋으로 먼저 검증한다.</text>
  <text x="1082" y="628" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#888888">DAPHNet FOG Dataset</text>

  <text x="110" y="712" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#00A651">리듬 자극은 이미 임상에서 쓰인다. 이 프로젝트가 더하는 것은 그것을 언제 켤지 기기가 스스로 정하게 하는 일이다.</text>

  <line x1="110" y1="772" x2="1490" y2="772" stroke="#E0E0E0" stroke-width="1"/>
  <text x="110" y="800" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#888888">[4] Slemenšek et al., Wearable Online Freezing of Gait Detection and Cueing System, Bioengineering, 2024 (n=9 예비연구)</text>

</svg>
