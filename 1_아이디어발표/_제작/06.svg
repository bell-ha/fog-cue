<!-- 06 발이 안 떨어질 때만 울린다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <text x="110" y="104" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#00A651">제안</text>
  <text x="110" y="168" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#111111">발이 안 떨어질 때만 울린다</text>
  <line x1="110" y1="196" x2="196" y2="196" stroke="#00A651" stroke-width="5"/>
  <text x="1490" y="838" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="18" fill="#BBBBBB">6 / 13</text>

  <circle cx="116" cy="260" r="4.5" fill="#00A651"/>
  <text x="138" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">발이 멈춰야 소리가 난다</text>
  <text x="138" y="298" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#666666">빠른 잔떨림이 일정 시간 이어질 때만 동결로 판정한다</text>
  <circle cx="116" cy="338" r="4.5" fill="#00A651"/>
  <text x="138" y="346" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">템포는 미리 정해두지 않는다</text>
  <text x="138" y="376" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#666666">직전 케이던스(걸음 빠르기)를 재서 매번 다시 계산한다</text>
  <circle cx="116" cy="416" r="4.5" fill="#00A651"/>
  <text x="138" y="424" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">다시 걸으면 끝난다</text>
  <text x="138" y="454" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#666666">발이 떨어지는 즉시 멈춘다. 습관화도 인지 부하도 쌓이지 않는다</text>
  <circle cx="116" cy="494" r="4.5" fill="#00A651"/>
  <text x="138" y="502" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" fill="#111111">20분을 차고 있어도 소리는 잠깐이다</text>
  <text x="138" y="532" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" fill="#666666">필요할 때만 주는 방식에서 소리가 난 시간은 전체 보행의 21~29%였다 [3]</text>

  <rect x="110" y="578" width="4" height="140" fill="#00A651"/>
  <text x="136" y="602" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#00A651">이 프로젝트의 자리</text>
  <text x="136" y="640" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#111111">동결을 보고 켜는 자극은 이미 연구 단계에 있다 (ParCuR).</text>
  <text x="136" y="672" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#111111">이 프로젝트는 그것을 학습용 KIT로 재현한다.</text>
  <text x="136" y="704" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#111111">거기에 청각 자극과 케이던스 적응을 더한다.</text>
  <text x="136" y="740" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" fill="#666666">본 프로젝트가 참고한 [3][4][5]에는 케이던스에 맞춘 사례가 없다.</text>

  <text x="850" y="268" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#111111">같은 20분 — 소리만 달라진다</text>
  <text x="850" y="298" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#666666">메트로놈 소리 (♩ = 분당 박수)</text>
  <text x="1470" y="298" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666">20분 중 세 번만 켜짐</text>
  <text x="850" y="394" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#666666">환자의 반응</text>
  <text x="1470" y="394" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="14" fill="#666666">%</text>
  <rect x="850" y="308" width="620" height="44" fill="#F5F5F5"/>
  <text x="840" y="409" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#666666">100</text>
  <text x="840" y="459" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#666666">50</text>
  <text x="840" y="509" text-anchor="end" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#666666">0</text>
  <line x1="850" y1="454" x2="1470" y2="454" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="906.5" y="308" width="59" height="44" fill="#D6F0E0"/>
  <rect x="1067.5" y="308" width="99" height="44" fill="#D6F0E0"/>
  <rect x="1318.5" y="308" width="47" height="44" fill="#D6F0E0"/>
  <g stroke="#00A651" stroke-width="5">
    <line x1="913.5" y1="312" x2="913.5" y2="352"/>
    <line x1="928.5" y1="312" x2="928.5" y2="352"/>
    <line x1="943.5" y1="312" x2="943.5" y2="352"/>
    <line x1="958.5" y1="312" x2="958.5" y2="352"/>
    <line x1="1074.5" y1="312" x2="1074.5" y2="352"/>
    <line x1="1091.5" y1="312" x2="1091.5" y2="352"/>
    <line x1="1108.5" y1="312" x2="1108.5" y2="352"/>
    <line x1="1125.5" y1="312" x2="1125.5" y2="352"/>
    <line x1="1142.5" y1="312" x2="1142.5" y2="352"/>
    <line x1="1159.5" y1="312" x2="1159.5" y2="352"/>
    <line x1="1325.5" y1="312" x2="1325.5" y2="352"/>
    <line x1="1336.5" y1="312" x2="1336.5" y2="352"/>
    <line x1="1347.5" y1="312" x2="1347.5" y2="352"/>
    <line x1="1358.5" y1="312" x2="1358.5" y2="352"/>
  </g>
  <text x="936" y="374" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="15" fill="#00A651">♩=96</text>
  <text x="1117" y="374" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="15" fill="#00A651">♩=88</text>
  <text x="1342" y="374" text-anchor="middle" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="15" fill="#00A651">♩=104</text>

  <path d="M850,414L910,414 Q936,405 962,414L1091,414 Q1117,405 1143,414L1316,414 Q1342,405 1368,414L1470,414 L1470,504 L850,504 Z" fill="#D8EFE2"/>
  <path d="M850,414L910,414 Q936,405 962,414L1091,414 Q1117,405 1143,414L1316,414 Q1342,405 1368,414L1470,414" fill="none" stroke="#0B7A3D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="969" y="470" font-family="'IBM Plex Mono','D2Coding',Menlo,monospace" font-size="13" fill="#35604A">20분 내내 반응이 유지된다</text>
  <line x1="936" y1="352" x2="936" y2="572" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="1117" y1="352" x2="1117" y2="572" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="1342" y1="352" x2="1342" y2="572" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- ══ 04·05 공유 플롯 좌표 — 두 장 완전 동일 ══ -->
  <line x1="850" y1="352" x2="1470" y2="352" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="850" y1="504" x2="1470" y2="504" stroke="#666666" stroke-width="1.5"/>
  <g stroke="#999999" stroke-width="1">
    <line x1="850" y1="504" x2="850" y2="511"/>
    <line x1="1005" y1="504" x2="1005" y2="511"/>
